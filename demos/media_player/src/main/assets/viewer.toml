# ============ 中继服务器 (结构化, 可读性强) ============
# transport: "quic" (udp+quic-v1, 推荐) | "tcp"
# ip 自动识别 ipv4/ipv6
# 兼容旧格式: relays = ["/ip4/.../p2p/..."]
[[relay_list]]
name = "中继1-QUIC"
ip = "101.35.90.171"
port = 4001
transport = "quic"
peer_id = "12D3KooWDGUejVsts1G4tGyf8ukkr73eWxCr1EUfCQxgcbSDUie1"

[[relay_list]]
name = "中继1-TCP"
ip = "101.35.90.171"
port = 4001
transport = "tcp"
peer_id = "12D3KooWDGUejVsts1G4tGyf8ukkr73eWxCr1EUfCQxgcbSDUie1"

[[relay_list]]
name = "中继2-QUIC"
ip = "124.221.175.240"
port = 4001
transport = "quic"
peer_id = "12D3KooWBko9VUfuMVEMUFcVaktZxEY48MZTeDTEMUgz4op86qUv"

[[relay_list]]
name = "中继2-TCP"
ip = "124.221.175.240"

// P2P Camera Media Player — Android Demo App
apply from: '../../constants.gradle'
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.p2pcamera.mediaplayer'
    compileSdk project.ext.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    defaultConfig {
        versionName '1.0'
        versionCode 1
        minSdkVersion 26
        targetSdkVersion project.ext.appTargetSdkVersion
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    // Kotlin coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:' + project.ext.kotlinxCoroutinesVersion

    // AndroidX
    implementation 'androidx.appcompat:appcompat:' + project.ext.androidxAppCompatVersion
    implementation 'androidx.constraintlayout:constraintlayout:' + project.ext.androidxConstraintLayoutVersion
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:' + project.ext.androidxLifecycleVersion
}
